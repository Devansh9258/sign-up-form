<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form id="signUpForm">
      <h2>Sign-up Down here 👇</h2>

      <div class="input-group">
        <label for="first-name">First name</label>
        <input
          id="first-name"
          type="text"
          placeholder="Enter your first name"
        />
        <p class="error-message" id="firstNameError" style="color: red"></p>
      </div>

      <div class="input-group">
        <label for="last-name">Last name</label>
        <input id="last-name" type="text" placeholder="Enter your last name" />
        <p class="error-message" id="lastNameError" style="color: red"></p>
      </div>

      <div class="input-group">
        <label for="number">Mobile Number</label>
        <input id="number" type="tel" placeholder="9876543210" />
        <p class="error-message" id="mobileNumberError" style="color: red"></p>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="example@gmail.com" />
        <p class="error-message" id="emailError" style="color: red"></p>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
        />
        <p class="error-message" id="passwordError" style="color: red"></p>
      </div>

      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          id="confirm-password"
          type="password"
          placeholder="Confirm your password"
        />
        <p
          class="error-message"
          id="confirmPasswordError"
          style="color: red"
        ></p>
      </div>

      <div class="checkbox">
        <label for="terms">
          <input id="terms" type="checkbox" />
          I accept the Terms of Use & Privacy Policy
        </label>
      </div>

      <button type="submit" id="submitButton" disabled>Sign Up</button>
    </form>
    <script src="Main.js"></script>
  </body>
</html>
